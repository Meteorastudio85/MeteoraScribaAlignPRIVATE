name: Build ScribaAlign

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ScribaAlign-VST3-${{ runner.os }}
          path: build/ScribaAlign_artefacts/Release/VST3/

      - name: Upload AU
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ScribaAlign-AU-macOS
          path: build/ScribaAlign_artefacts/Release/AU/
